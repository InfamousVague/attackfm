# This package is also the workspace root. The music server, the shared identity
# crate (the token contract), and the registry service build together so a
# change to the token format cannot land on one side without the other.
[workspace]
members = ["crates/identity", "crates/registry"]
resolver = "2"

[package]
name = "attackfm-server"
version = "0.1.66"
edition = "2021"

[dependencies]
# statvfs only: how much room the music volume has left, which is what lets
# a hot server ask its source for exactly the set that will fit.
libc = "0.2"
# The identity token contract: verify a registry-issued token offline, with no
# call back to the registry, so a server keeps working when the directory blips.
afm-identity = { path = "crates/identity" }

axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util", "process"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
# Beta sampling for the DJ's exploration slots. Pure Rust - no native deps.
rand_distr = "0.4"
# Stream tokens are HMAC-SHA256 over (user, expiry) - stateless to verify, so a
# range request never touches the database.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Signs the ES256 JWT that authenticates this server to APNs, straight from
# the .p8 Apple issues. No other auth path here uses it.
jsonwebtoken = "9"
# Tag reading for the scanner: FLAC/ALAC/MP3/M4A/OGG/Opus/WAV/AIFF in one crate,
# including embedded cover art and the stream properties the lossless badge needs.
lofty = "0.22"
mime_guess = "2"
# Downscales cover art once per requested size (stream.rs): the originals are
# whatever 1-3 MB picture the tags carried, and a 100px grid cell needs none of
# it. Decoders match the four formats scan.rs ever stores; output is JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# The curator's tempo analysis: a spectral-flux onset envelope needs an FFT, and
# this one is pure Rust so the Linux cross-compile stays a single binary.
rustfft = "6"
futures-util = "0.3"
# The import queue's Spotify embed metadata fetch. rustls, so the Linux
# cross-compile stays free of an OpenSSL sysroot.
# http2: APNs speaks nothing else.
# stream: the library-tools art download caps an untrusted body at 10MB by
# reading it chunkwise instead of trusting Content-Length.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "stream"] }

[profile.release]
lto = true
