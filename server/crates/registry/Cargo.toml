[package]
name = "attackfm-registry"
version = "0.1.0"
edition = "2021"

# The central identity directory: accounts, friendships, invites, and the signed
# tokens every music server trusts. Its own binary, its own database, its own
# domain (registry.attack.fm) - deliberately separate from any music server so
# no one server owns everyone's identity.
[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
base64 = "0.22"
afm-identity = { path = "../identity" }

[[bin]]
name = "attackfm-registry"
path = "src/main.rs"
