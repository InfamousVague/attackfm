# HAND-EDITED: `deploymentTarget` here; DEVELOPMENT_TEAM / CODE_SIGN_STYLE /
# the simulator CODE_SIGN_ENTITLEMENTS override further down; the CarPlay +
# MediaPlayer framework dependencies; and Sources/app/carplay.{h,m} beside the
# generated main.mm. None of that is read from tauri.conf.json.
#
# `tauri ios init` writes this file from its own template. It leaves an existing
# one alone, but a delete-and-reinit resets both edits - so re-apply them, and
# then run `xcodegen generate` in this directory, because neither `ios init` nor
# `ios build` re-runs xcodegen for you; the .xcodeproj keeps whatever it was
# last generated with.
#
# Tauri's template hardcodes 14.0 and does NOT read
# `bundle.iOS.minimumSystemVersion` from tauri.conf.json when generating this
# file (it is set there too, so a fixed CLI starts working on its own). Xcode
# 26+ refuses 14.0 outright - "the range of supported deployment target versions
# is 15.0 to 27.0.x" - and the build fails before compiling anything.
#
# Everything else this app needs from the Info.plist - UIBackgroundModes for
# background audio, the local-network permission - comes from
# `src-tauri/Info.ios.plist`, which the CLI merges at build time. That file
# survives a re-init; this one does not.
name: app
options:
  bundleIdPrefix: com.mattssoftware.attackfm
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
# HAND-ADDED: Swift halves of Tauri mobile plugins. `tauri ios init` normally
# stages these itself, but this project predates any plugin with real iOS
# code, so they are vendored here instead: `.tauri/tauri-api` is copied from
# the tauri crate's mobile/ios-api (keep in step with the tauri version in
# Cargo.lock), and each plugin package beside it from the plugin crate's ios/
# directory (its Package.swift expects ../.tauri/tauri-api, which is exactly
# where it now is). Without this the Rust side's ios_plugin_binding resolves
# to nothing, the plugin silently no-ops, and - concretely - the Taptic
# Engine never fires. After editing, run `xcodegen generate` here.
packages:
  tauri-plugin-haptics:
    path: tauri-plugin-haptics
settingGroups:
  app:
    base:
      PRODUCT_NAME: AttackFM
      PRODUCT_BUNDLE_IDENTIFIER: com.mattssoftware.attackfm
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Present for navigation only. Without `buildPhase: none`, xcodegen
      # treats the libapp.a builds inside as resources and copies them into
      # the app - and the moment two arch subdirs both hold one, the two
      # copies collide: "Multiple commands produce .../AttackFM.app/libapp.a".
      # Linking never needed target membership; it goes through the explicit
      # framework dependency + LIBRARY_SEARCH_PATHS.
      - path: Externals
        buildPhase: none
      - path: app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    # xcodegen REWRITES the file at this path on every generate, so the keys
    # must live here as properties - an edit made to the .entitlements file
    # directly is silently reverted by the next generate (that is how the app
    # group vanished the first time). The simulator variant beside it is only
    # referenced through CODE_SIGN_ENTITLEMENTS below, so THAT file is
    # hand-edited and survives.
    #
    # The app group is the widget's only channel (widgetPublish.swift writes,
    # widget/AttackFMWidget.swift reads). Not an Apple-granted entitlement
    # like CarPlay: automatic signing registers the group on the team by
    # itself on the first device build.
    entitlements:
      path: app_iOS/app_iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mattssoftware.attackfm
        # Universal Links for invites: https://registry.attack.fm/i/CODE opens
        # the app's Join screen. Declared HERE and not only in the
        # .entitlements file, because xcodegen rewrites that file from this
        # block on every generate - the key had been present by accident (the
        # CLI wrote it once) and was one regenerate from vanishing. Automatic
        # signing enables the capability itself; this is not an Apple-granted
        # entitlement like CarPlay. The registry serves the matching
        # apple-app-site-association. Spotify's host is deliberately absent:
        # its AASA will never list this app.
        com.apple.developer.associated-domains:
          - applinks:registry.attack.fm
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        # Signing, for building onto a real iPhone (the simulator needs none).
        # Same team PrettyCardboard signs with. Automatic style lets Xcode mint
        # and refresh the provisioning profile itself, which is what keeps a
        # device build working without a profile checked into the repo.
        #
        # Hand-added: the CLI does not propagate bundle.iOS.developmentTeam
        # from tauri.conf.json into this file, where it is set as well.
        DEVELOPMENT_TEAM: F6ZAL7ANAD
        CODE_SIGN_STYLE: Automatic
        # Simulator builds sign with the CarPlay entitlement (no provisioning
        # check there); device builds keep the base entitlements so signing
        # succeeds before Apple grants com.apple.developer.carplay-audio.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": app_iOS/app_iOS.simulator.entitlements
        ENABLE_BITCODE: false
        # iPhone only (1). AttackFM's mobile UI is phone-designed - the desktop
        # experience is the separate Tauri desktop app, not an iPad layout - so
        # the store listing needs no iPad screenshots and reviewers never see a
        # stretched-up phone UI on a tablet.
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      # CarPlay templates + the system now-playing center (carplay.m). CarPlay
      # itself is inert until the entitlement is present - see the simulator
      # entitlements file for how that is staged. One dependencies block only:
      # a second `dependencies:` key under this target is duplicate YAML, and
      # xcodegen answers it with two libapp.a link phases and a "Multiple
      # commands produce" build failure.
      - sdk: CarPlay.framework
      - sdk: MediaPlayer.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      # The plugin Swift packages declared above; linking them is what makes
      # their @_cdecl init symbols real.
      - package: tauri-plugin-haptics
      # WidgetKit in the APP because widgetPublish.swift rings
      # WidgetCenter.reloadTimelines; the widget itself is the target below,
      # embedded into PlugIns by this dependency.
      - sdk: WidgetKit.framework
      - target: widget_iOS
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  # HAND-ADDED: the home-screen widget (widget/AttackFMWidget.swift). A
  # WidgetKit extension is its own process; it shares nothing with the app
  # but the App Group container the app publishes into (widgetPublish.swift).
  # Deployment 17 rather than the app's 15: containerBackground is the only
  # background API Xcode 26+ accepts for widgets, and a phone old enough to
  # miss it simply is not offered the widget while the app itself still runs.
  # CFBundleShortVersionString must stay in step with the app target's - App
  # Store validation rejects an archive whose extension disagrees.
  widget_iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: widget
    info:
      path: widget/Info.plist
      properties:
        CFBundleDisplayName: AttackFM
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: widget/widget_iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mattssoftware.attackfm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattssoftware.attackfm.widget
        DEVELOPMENT_TEAM: F6ZAL7ANAD
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    preBuildScripts:
      # The tauri CLI stamps the APP's version from tauri.conf.json on every
      # build, and App Store validation wants an extension's version to agree
      # with its container's. Same source, same moment, so they cannot drift.
      - script: |
          VERSION=$(python3 -c "import json;print(json.load(open('${SRCROOT}/../../tauri.conf.json'))['version'])")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "${SRCROOT}/widget/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "${SRCROOT}/widget/Info.plist" || true
        name: Stamp widget version
        basedOnDependencyAnalysis: false