[package]
name = "app"
version = "0.1.0"
description = "A Glacier UI desktop app"
authors = ["you"]
edition = "2021"

# The library the app binary links against; also what mobile targets build.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Only for statvfs: how much room is left on the volume the offline vault
# lives on, which is what decides whether Dates may be cached ahead.
libc = "0.2"
# protocol-asset is what lets a local file play through `convertFileSrc` on the
# desktop. Leave it on for every target: the mobile builds simply never call it
# (their library arrives over HTTP), and the `tauri` CLI rewrites this line from
# the config it reads, so a mobile config that switched the protocol off would
# strip the feature here and break desktop playback.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# The folder picker and the filesystem access behind the music-library setting.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verifying a downloaded frontend bundle before it is allowed to run.
sha2 = "0.10"
# Async runtime for the music-import download queue (subprocess + progress).
tokio = { version = "1", features = ["full"] }
# Scrapes public Spotify embed pages for import cover art / titles / totals.
# json feature: the Spotify account layer reads the Web API as JSON.
# rustls, not the default native-tls: native-tls resolves to the system stack on
# macOS/iOS but to OpenSSL on Android, which will not cross-compile without a
# vendored build. rustls is pure Rust and links the same on every target.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-haptics = "2.3.2"
# The OS notification tray. LOCAL notifications only - the app raising its own
# alerts on the device it is running on, which is a different pipeline from the
# server-sent push in `push.rs` and needs none of its keys.
tauri-plugin-notification = "2"

# Desktop-only crates. A phone has no traffic lights to position, and decorum
# does not build for iOS or Android - so it is named per-target rather than
# left in the shared list where a mobile build would trip over it.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Positions the native macOS traffic-light buttons so they sit centered in the
# taller custom title bar (and re-applies the inset on resize). No-op elsewhere.
tauri-plugin-decorum = "1"

# AppKit, for the one thing the Tauri window API has no word for: holding the
# window square as it is dragged. Already in the tree behind tauri/wry, so this
# only names what is being used.
# The Objective-C runtime, for claiming the AVAudioSession so playback survives
# the screen locking. Three message sends into a framework already loaded in
# the process - no AVFAudio bindings crate needed.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
# NSURL + NSNumber carry the backup exclusion on the offline and bundle
# directories (nobackup.rs); NSString is the path in.
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSValue", "NSError"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSApplication + NSImage carry the beat-driven dock icon (dock_wave.rs).
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSWindow", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSData"] }

[features]
# Kept in sync with tauri.conf.json > app > security > csp.
custom-protocol = ["tauri/custom-protocol"]
# A diagnostic desktop build that always runs its embedded frontend and never
# accepts an OTA bundle. This keeps a test client stable while releases move.
pinned-build = []

# tao 0.35.3 (the newest tao any released tauri accepts) returns a
# UISceneConfiguration from application:configurationForConnectingSceneSession:
# whose Retained drops before UIKit reads it. Debug builds survive on autorelease
# -pool luck; release builds hand UIKit a freed object and segfault at launch in
# -[UIApplication _connectUISceneFromFBSScene:transitionContext:] on iOS 26/27
# devices. vendor/tao is a pristine 0.35.3 plus the one-line 0.36.0 backport
# (autorelease_ptr) in src/platform_impl/ios/view.rs. Drop this patch and the
# vendor/ copy once tauri-runtime-wry depends on tao >= 0.36.
[patch.crates-io]
tao = { path = "vendor/tao" }
